[package]
name = "picta"
version = "2.0.0"
description = "Show local media on a display you choose."
authors = ["Picta contributors"]
license = "MIT"
repository = "https://github.com/gbyo/picta"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "picta_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Version check only. `native-tls` uses the operating system's own TLS stack
# (Schannel on Windows, Security.framework on macOS) rather than bundling one,
# which keeps the portable executable small. `system-proxy` matters because
# venue networks often route through a proxy.
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "json",
  "http2",
  "system-proxy",
] }
semver = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
