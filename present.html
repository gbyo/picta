<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Picta Presentation</title>
    <link rel="stylesheet" href="/src/present.css" />
  </head>
  <body>
    <!--
      Two panes. In `full` layout the image pane is the whole screen and the
      board is not rendered at all; in `split` they take half each, which is what
      an ultrawide screen at a match is for. One window either way: two windows
      would be two things to place correctly on the right monitor.
    -->
    <div class="panes">
      <div class="pane pane-images">
        <!-- Two layers, one visible at a time. Nothing else renders here. -->
        <img id="layer-a" class="layer visible" alt="" />
        <img id="layer-b" class="layer" alt="" />
      </div>

      <aside class="pane pane-board" id="board-pane">
        <p class="board-title">On Court</p>
        <!-- A real table: proper column headers, and free row striping. -->
        <table class="board" id="board"></table>
      </aside>
    </div>

    <!--
      The player takeover card. Sweeps over the images and away again; the image
      layers underneath are never disturbed, so the show resumes exactly where it
      was. Empty and inert until the controller sends a card.
    -->
    <div id="takeover" class="takeover" aria-hidden="true">
      <div class="takeover-panel">
        <div class="takeover-jersey" id="takeover-jersey"></div>
        <div class="takeover-body">
          <p class="takeover-position" id="takeover-position"></p>
          <p class="takeover-name" id="takeover-name"></p>
          <div class="takeover-rule"></div>
          <ul class="takeover-stats" id="takeover-stats"></ul>
        </div>
      </div>
    </div>
    <script type="module" src="/src/present.ts"></script>
  </body>
</html>
