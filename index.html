<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picta</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="header-row">
          <h1 class="wordmark">Picta</h1>
          <p id="global-status" class="global-status" aria-live="polite">Ready</p>
        </div>
        <section id="scene-strip" class="scene-strip" aria-label="Scene" hidden>
          <span class="scene-strip-label">Scene</span>
          <div
            id="scene-buttons"
            class="scene-buttons"
            role="toolbar"
            aria-label="Switch scene"
          ></div>
        </section>
      </header>

      <div class="tabs" role="tablist" aria-label="Picta sections">
        <button
          type="button"
          class="tab"
          id="tab-media"
          role="tab"
          aria-selected="true"
          aria-controls="panel-media"
        >
          Media
        </button>
        <button
          type="button"
          class="tab"
          id="tab-players"
          role="tab"
          aria-selected="false"
          aria-controls="panel-players"
          tabindex="-1"
        >
          Players
        </button>
        <button
          type="button"
          class="tab"
          id="tab-output"
          role="tab"
          aria-selected="false"
          aria-controls="panel-output"
          tabindex="-1"
        >
          Output
        </button>
      </div>

      <section id="panel-media" class="tab-panel" role="tabpanel" aria-labelledby="tab-media">
        <div class="resource-header">
          <div>
            <h2 class="block-title">Media</h2>
            <p id="media-resource-name" class="muted">Inline media</p>
          </div>
          <details class="resource-menu">
            <summary aria-label="Media set file menu">⋯</summary>
            <div class="menu-panel">
              <button type="button" id="media-new-set">New Media Set</button>
              <button type="button" id="media-open-set">Open Media Set…</button>
              <button type="button" id="media-save-set">Save Media Set</button>
              <button type="button" id="media-save-set-as">Save Media Set As…</button>
              <button type="button" id="media-reveal-set">Reveal in Finder / Explorer</button>
            </div>
          </details>
        </div>

        <button type="button" id="media-dropzone" class="dropzone">
          <span class="dropzone-line">Drop images or videos here</span>
          <span class="dropzone-sub">or <span class="link-ish">Choose Media</span></span>
        </button>
        <div id="media-list" class="media-list" aria-label="Media in playback order"></div>
        <div class="row">
          <p id="media-count" class="muted" aria-live="polite">No media</p>
          <button type="button" id="media-clear" class="text-button">Clear</button>
        </div>
        <div id="media-missing" class="notice" role="status" hidden>
          <p id="media-missing-text"></p>
          <button type="button" id="media-locate" class="small-button">Locate Files…</button>
        </div>

        <section class="settings-grid" aria-label="Media settings">
          <label
            >Images stay
            <select id="media-duration" class="control"></select
          ></label>
          <label
            >Transition
            <select id="media-transition" class="control">
              <option value="crossfade">Crossfade</option>
              <option value="none">None</option>
            </select></label
          >
          <label
            >Sizing
            <select id="media-sizing" class="control">
              <option value="fit">Fit</option>
              <option value="fill">Fill</option>
            </select></label
          >
        </section>
        <div class="row gap">
          <button type="button" id="media-previous" class="small-button grow">Previous</button>
          <button type="button" id="media-next" class="small-button grow">Next</button>
        </div>
      </section>

      <section
        id="panel-players"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-players"
        hidden
      >
        <div id="no-team" class="empty-state">
          <h2 class="block-title">Players</h2>
          <p>No team loaded.</p>
          <div class="row gap">
            <button type="button" id="team-new" class="small-button grow">New Team</button
            ><button type="button" id="team-open" class="small-button grow">Open Team…</button>
          </div>
        </div>
        <div id="team-loaded" hidden>
          <div class="resource-header">
            <div>
              <h2 id="team-name" class="section-heading"></h2>
              <p id="team-detail" class="muted"></p>
              <p id="team-file-name" class="muted"></p>
              <div id="custom-sport-editor" class="custom-sport-editor" hidden></div>
            </div>
            <details id="team-menu" class="resource-menu">
              <summary aria-label="Team file menu">⋯</summary>
              <div class="menu-panel">
                <button type="button" id="team-new-menu">New Team</button
                ><button type="button" id="team-open-menu">Open Team…</button
                ><button type="button" id="team-save">Save Team</button
                ><button type="button" id="team-save-as">Save Team As…</button
                ><button type="button" id="team-reveal">Reveal in Finder / Explorer</button
                ><button type="button" id="team-locate">Locate Missing Media…</button>
              </div>
            </details>
          </div>
          <div id="player-subtabs" class="subtabs" role="tablist" aria-label="Player views">
            <button type="button" id="roster-view-tab" class="subtab active" role="tab">
              Roster</button
            ><button type="button" id="live-view-tab" class="subtab" role="tab">Live</button>
          </div>
          <div id="roster-view">
            <section id="manual-session" class="manual-session" aria-label="Manual lineup" hidden>
              <div class="manual-heading">
                <h3 id="manual-title" class="manual-title"></h3>
                <p id="manual-count" class="muted" aria-live="polite"></p>
              </div>
              <div id="manual-rows" class="manual-rows"></div>
              <div class="row gap">
                <button type="button" id="manual-undo" class="small-button grow">Undo Last</button>
                <button type="button" id="manual-end" class="small-button grow">End Lineup</button>
              </div>
            </section>
            <div id="roster-setup">
              <div class="row">
                <h3 class="subheading">Groups</h3>
                <select
                  id="group-select"
                  class="control compact-control"
                  aria-label="Roster group"
                ></select>
              </div>
              <div id="group-editor" class="group-editor"></div>
              <form id="add-player" class="add-player">
                <input
                  id="new-number"
                  class="field-number"
                  type="text"
                  placeholder="#"
                  aria-label="Jersey number"
                  maxlength="3"
                  autocomplete="off"
                /><input
                  id="new-name"
                  type="text"
                  placeholder="Player name"
                  aria-label="Player name"
                  autocomplete="off"
                /><input
                  id="new-position"
                  class="field-position"
                  type="text"
                  placeholder="Pos"
                  aria-label="Position"
                  maxlength="8"
                  autocomplete="off"
                /><button type="submit" class="small-button">Add Player</button>
              </form>
              <div id="roster-list" class="roster-list"></div>
            </div>
          </div>
          <div id="live-view" hidden>
            <div class="row">
              <h3 class="subheading">Live stats</h3>
              <select
                id="live-group-select"
                class="control compact-control"
                aria-label="Live group"
              ></select>
            </div>
            <div id="live-table" class="live-table"></div>
          </div>
          <aside id="player-inspector" class="inspector" hidden></aside>
        </div>
      </section>

      <section
        id="panel-output"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-output"
        hidden
      >
        <section class="block">
          <h2 class="block-title">Display</h2>
          <select id="display-select" class="control" aria-label="Output display"></select>
          <p id="display-detail" class="muted detail"></p>
          <button type="button" id="identify" class="small-button">Identify Displays</button>
        </section>

        <section class="block">
          <div class="resource-header">
            <div>
              <h2 class="block-title">Scene</h2>
              <p id="scene-current" class="muted"></p>
            </div>
            <details id="scene-menu" class="resource-menu">
              <summary aria-label="Scene menu">⋯</summary>
              <div class="menu-panel">
                <button type="button" id="scene-new">New Scene…</button
                ><button type="button" id="scene-duplicate">Duplicate Scene…</button
                ><button type="button" id="scene-rename">Rename Scene…</button
                ><button type="button" id="scene-default">Set as Default</button
                ><button type="button" id="scene-move-left">Move Left</button
                ><button type="button" id="scene-move-right">Move Right</button
                ><button type="button" id="scene-delete">Delete Scene…</button>
              </div>
            </details>
          </div>
          <div id="scene-picker" class="scene-buttons" role="toolbar" aria-label="Scenes"></div>
          <p id="scene-hint" class="muted detail"></p>
        </section>

        <section class="block" id="layout-block">
          <h2 id="layout-heading" class="block-title">Layout</h2>
          <div id="layout-preview" class="layout-preview" aria-label="Output layout preview"></div>
          <p id="layout-detail" class="muted detail"></p>
          <div id="layout-normal" class="row gap">
            <button type="button" id="scene-edit" class="small-button">Edit Zones</button>
          </div>
          <div id="zone-edit-panel" class="zone-edit-panel" hidden>
            <div class="zone-edit-section">
              <span class="field-label">Start from</span>
              <div id="layout-presets" class="preset-buttons"></div>
            </div>
            <div class="zone-edit-section">
              <span class="field-label">Selected zone</span>
              <select
                id="custom-zone-select"
                class="control"
                aria-label="Selected layout zone"
              ></select>
              <label class="stacked-field"
                >Role
                <select id="custom-role-select" class="control" aria-label="Zone role">
                  <option value="program">Program</option>
                  <option value="live-board">Live Board</option>
                  <option value="media">Media</option>
                  <option value="blank">Blank</option>
                </select></label
              >
              <div class="zone-edit-actions">
                <button type="button" id="split-columns" class="small-button">
                  Split Left / Right</button
                ><button type="button" id="split-rows" class="small-button">
                  Split Top / Bottom</button
                ><button type="button" id="merge-zone" class="small-button">Merge</button>
              </div>
            </div>
            <label class="checkbox-label"
              ><input type="checkbox" id="zone-edit-safe" checked /> Show safe areas</label
            >
            <div class="row gap">
              <button type="button" id="zone-edit-cancel" class="small-button grow">Cancel</button>
              <button type="button" id="zone-edit-done" class="small-button primary-ish grow">
                Done
              </button>
            </div>
          </div>
        </section>

        <section class="settings-grid">
          <label
            >Live Board
            <select id="output-group" class="control"></select></label
          ><label
            >Background
            <select id="output-background" class="control">
              <option value="black">Black</option>
              <option value="primary">Team primary</option>
              <option value="secondary">Team secondary</option>
            </select></label
          >
        </section>
        <div class="output-actions">
          <button type="button" id="output-start" class="primary">Start Output</button
          ><button type="button" id="output-stop" class="small-button danger-button" hidden>
            Stop Output
          </button>
        </div>
      </section>

      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      <div id="cue-controls" class="cue-controls" hidden>
        <p id="cue-status" class="cue-status"></p>
        <div class="row gap">
          <button type="button" id="cue-previous" class="small-button grow">Previous</button
          ><button type="button" id="cue-next" class="small-button grow">Next</button
          ><button type="button" id="cue-end" class="small-button grow">End</button>
        </div>
      </div>
      <div id="update-notice" class="notice info" role="status" hidden>
        <p id="update-text"></p>
        <button type="button" id="update-open" class="small-button">What’s New</button>
      </div>
    </main>

    <dialog id="confirm-dialog" class="confirm">
      <form method="dialog">
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button type="submit" value="cancel" class="small-button">Cancel</button
          ><button type="submit" value="discard" class="small-button">Don’t Save</button
          ><button type="submit" value="save" class="small-button primary-ish" autofocus>
            Save All
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="scene-dialog" class="confirm">
      <form method="dialog" id="scene-dialog-form">
        <h2 id="scene-dialog-title" class="dialog-title">New Scene</h2>
        <label class="stacked-field"
          >Name
          <input id="scene-dialog-name" type="text" autocomplete="off" maxlength="60" />
        </label>
        <p id="scene-dialog-error" class="dialog-error" role="alert" hidden></p>
        <div class="confirm-actions">
          <button type="submit" value="cancel" class="small-button">Cancel</button
          ><button
            type="submit"
            value="confirm"
            id="scene-dialog-confirm"
            class="small-button primary-ish"
          >
            Create
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="scene-delete-dialog" class="confirm">
      <form method="dialog">
        <h2 class="dialog-title">Delete Scene</h2>
        <p id="scene-delete-text"></p>
        <div class="confirm-actions">
          <button type="submit" value="cancel" class="small-button" autofocus>Cancel</button
          ><button type="submit" value="delete" class="small-button danger-button">Delete</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
